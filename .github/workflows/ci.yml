name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Install Pi
        run: |
          npm install --global --ignore-scripts @earendil-works/pi-coding-agent@latest
          mkdir -p "$HOME/.pi"

      - name: Test
        run: npm test

      - name: Smoke test development stack
        env:
          PI_OFFLINE: '1'
        run: |
          log_file="$RUNNER_TEMP/pi-livecraft-dev.log"
          setsid npm run dev >"$log_file" 2>&1 &
          dev_pid=$!

          cleanup() {
            kill -- "-$dev_pid" 2>/dev/null || true
            wait "$dev_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          ready=false
          for _ in {1..30}; do
            if curl --fail --silent http://127.0.0.1:43121/api/health > /dev/null 2>&1; then
              ready=true
              break
            fi
            if ! kill -0 "$dev_pid" 2>/dev/null; then
              break
            fi
            sleep 1
          done

          if [[ "$ready" != true ]]; then
            cat "$log_file"
            exit 1
          fi

          if [[ ! -f dashboard/dist/index.js || ! -f dashboard/dist/style.css ]]; then
            cat "$log_file"
            exit 1
          fi
